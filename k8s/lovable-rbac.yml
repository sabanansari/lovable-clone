apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lovable-k8s-role
  namespace: shuttle-apps

rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/exec
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lovable-k8s-rolebinding
  namespace: shuttle-apps

subjects:
  - kind: ServiceAccount
    name: default
    namespace: shuttle-apps

roleRef:
  kind: Role
  name: lovable-k8s-role
  apiGroup: rbac.authorization.k8s.io